<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mandal Academy</title>
<style>
:root{--dk:#141414f0;--hi:#c6ff2e;--hif:#14210a;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#000;font-family:system-ui,"Segoe UI",sans-serif}
[hidden]{display:none!important}
#brand{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:14px;z-index:5;display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:14px;background:var(--dk);color:#fff;font:700 16px system-ui,Segoe UI,sans-serif;pointer-events:none;user-select:none}
#brand img{width:34px;height:34px;border-radius:8px}
.lg{width:40px;height:40px;border-radius:9px}
.bn{font-size:20px;margin-right:22px}
.nb{display:inline-block;border:2px solid currentColor;border-radius:7px;padding:3px 6px;font:800 14px/1 system-ui,Segoe UI,sans-serif;letter-spacing:.02em}
#ovh .bt{display:inline-block;width:24px;height:16px;vertical-align:middle;margin-right:8px;border-radius:4px}
#ovh .t svg{vertical-align:middle;margin-right:6px}
#board{position:fixed;inset:0;background:#000}
.bgwhite{background:#fff}
.bgblack{background:#0b0b0b}
.bggreen{background:#16352a}
.bggrid,.bglined{background-color:#fff;background-image:linear-gradient(#0000 calc(100% - 1px),#cfd8e3 0),linear-gradient(90deg,#0000 calc(100% - 1px),#cfd8e3 0);background-size:var(--gs,32px) var(--gs,32px);background-position:var(--gx,0) var(--gy,0)}
.bglined{background-image:linear-gradient(#0000 calc(100% - 1px),#cfd8e3 0);background-size:100% var(--gs,32px)}
.bgdgrid{background-color:#0f1720;background-image:linear-gradient(#0000 calc(100% - 1px),#2b3644 0),linear-gradient(90deg,#0000 calc(100% - 1px),#2b3644 0);background-size:var(--gs,32px) var(--gs,32px);background-position:var(--gx,0) var(--gy,0)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.dock{position:fixed;display:flex;align-items:center;gap:4px;padding:6px;border-radius:16px;background:var(--dk);box-shadow:0 4px 18px #0006;color:#f4f4f4;z-index:5;user-select:none}
#dock{top:calc(50% - 40px);right:14px;transform:translateY(-50%);flex-direction:column;max-height:calc(100% - 140px);overflow-y:auto}
#dock .sep{width:26px;height:1px;margin:4px 0}
@media (max-height:900px){#dock button{min-width:44px;min-height:44px}}
@media (max-height:780px){#dock{gap:2px}#dock button{min-height:38px}}
#lft{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px}
#rgt{bottom:calc(14px + env(safe-area-inset-bottom,0px));right:14px}
#pop,#lawp,#insp,#ntp,#bgp{top:calc(50% - 40px);right:88px;transform:translateY(-50%);flex-direction:column;align-items:stretch;gap:10px;padding:12px 14px}
.row{display:flex;align-items:center;justify-content:center;gap:8px}
button{min-width:48px;min-height:48px;padding:0 10px;border:0;border-radius:12px;background:transparent;color:inherit;display:grid;place-items:center;position:relative;font:600 15px system-ui,"Segoe UI",sans-serif;cursor:pointer}
button:hover{background:#ffffff1f}
button:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
button.on,button.lime{background:var(--hi);color:var(--hif)}
button.sw{min-width:38px;min-height:38px;padding:0;border-radius:50%;border:3px solid #666}
button.sw.sel,label.sw.sel{border-color:#fff}
#selbar [hidden]{display:none!important}
.brk{display:none}
#selbar.shs{flex-wrap:wrap;justify-content:center;align-items:center;width:318px;row-gap:2px}
#selbar.shs .brk{display:block;flex-basis:100%;height:0}
#selbar.shs .cc,#selbar.shs #pastebtn,#selbar.shs .dl{order:1}
#selbar.shs #brk0{order:2}
#selbar.shs input.sh,#selbar.shs b.sh{order:3}
#selbar.shs #brk1{order:4}
#selbar.shs .sw.sh{order:5}
#selbar.shs input[type=range].sh{width:200px}
#selbar .sw{opacity:1!important;filter:none!important;min-width:28px;min-height:28px;width:28px;height:28px;border-width:2px}
#selbar input[type=range].sh{width:110px}#selbar b.sh{min-width:26px;text-align:center;font-size:13px}
#pop.shp #colrow{order:-2}#pop.shp #szrow{order:-1}
#zm{position:fixed;z-index:60;display:flex;flex-direction:column;gap:4px;padding:6px;background:var(--dk);border-radius:14px;box-shadow:0 6px 24px #0008}
#zm button{min-width:84px;min-height:40px;padding:6px 14px;border:0;border-radius:10px;background:#ffffff14;color:#fff;font:600 15px system-ui,Segoe UI,sans-serif;cursor:pointer}
#zm button:hover{background:var(--hi);color:var(--hif)}
label.sw{position:relative;display:inline-block;box-sizing:border-box;width:38px;height:38px;border-radius:50%;border:3px solid #666;cursor:pointer;overflow:hidden;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
label.sw input{position:absolute;inset:-8px;width:60px;height:60px;opacity:0;cursor:pointer;border:0;padding:0}
.sep{width:1px;height:26px;background:#ffffff33;margin:0 4px}
.dot{position:absolute;right:7px;bottom:6px;width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;box-sizing:border-box}
#pg{min-width:64px;text-align:center;font-weight:600}
#bgcols,#bgst{flex-wrap:wrap;max-width:280px}
#bgcol{width:64px;height:40px;border:0;background:none;padding:0;cursor:pointer}
#bgall{width:22px;height:22px}
#shrow{display:block;width:560px;max-height:calc(100vh - 400px);min-height:150px;overflow-y:auto}
.sh{font:700 12px system-ui,sans-serif;letter-spacing:.08em;opacity:.7;margin:8px 0 6px}
.sg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sg button{min-width:0;min-height:0;height:64px;padding:4px 2px;border:1px solid #ffffff22;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500}
.sg canvas{position:static;width:48px;height:32px;touch-action:auto}
.sg button.on canvas{filter:invert(1)}
#ntp,#bgp{top:auto;bottom:calc(88px + env(safe-area-inset-bottom,0px));right:14px;transform:none}
#dlp{right:88px;top:auto;bottom:calc(100px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:6px;padding:8px;width:220px}
#ntg{grid-template-columns:repeat(4,96px)}
.bt{display:block;width:46px;height:28px;border-radius:6px;border:1px solid #ffffff66}
#adrow{max-width:300px}
#adrow small{opacity:.65;font-size:12px}
#zp{min-width:64px;font-weight:600}
.mm{font-size:12px;opacity:.7;min-width:24px;text-align:center}
#pg{cursor:pointer}
#selbar{gap:6px;flex-wrap:wrap;max-width:94vw}
#smode{top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);gap:6px;padding:6px 10px}
#smode b{padding:0 8px;font-size:14px;opacity:.85}
#smode button{min-width:76px;min-height:48px;gap:2px}
#smode button span{font-size:12px}
#lawq{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid #ffffff33;background:#00000055;color:#fff;font:15px system-ui,Segoe UI,sans-serif}
.lh{font:700 12px system-ui,sans-serif;letter-spacing:.06em;opacity:.75;margin:12px 0 6px;text-transform:uppercase}
#ecur{position:fixed;z-index:6;pointer-events:none;border:2px solid #ffffffd9;border-radius:50%;background:rgba(70,70,70,.45);box-shadow:0 0 0 1px #0008;transform:translate(-50%,-50%)}
#lawtabs{flex-wrap:wrap;max-width:420px}
#lawl{display:block;width:500px;max-height:calc(100vh - 380px);min-height:140px;overflow-y:auto}
.li{display:block;width:100%;text-align:left;min-height:0;padding:8px 12px;margin-bottom:6px;border:1px solid #ffffff22;border-radius:10px}
.li b{display:block;font-size:12px;opacity:.75;margin-bottom:3px}
.li span{font-size:15px;font-weight:500}
#autod{width:22px;height:22px}
#adrow{cursor:pointer}
#insg{grid-template-columns:repeat(2,100px)}
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;padding:10px 18px;border-radius:12px;background:var(--dk);color:#fff;font:600 15px system-ui,Segoe UI,sans-serif;max-width:90vw}
#bgp label{cursor:pointer}
input[type=range]{width:200px;height:32px}
@media (max-width:1150px){#lft{display:none}}
#ov{position:fixed;inset:0;z-index:20;overflow:auto;background:#0b0e12;color:#f4f4f4}
#ovh{position:sticky;top:0;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 28px;background:#0b0e12;border-bottom:1px solid #ffffff22}
#ovh h1{margin:0 auto 0 0;font-size:30px}
#ovh span{opacity:.7}
#ovh button.t{border:1px solid #ffffff33;font-size:17px;min-height:48px;padding:0 18px}
#ovg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:26px;padding:28px}
.th{position:relative;border:2px solid #ffffff33;border-radius:14px;overflow:hidden;cursor:pointer;width:100%;box-sizing:border-box}
.th.cur{border-color:var(--hi)}
.th canvas{position:absolute;inset:0;width:100%;height:100%}
.pc{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.pc div{display:flex}
.pc button{min-width:40px;min-height:40px;padding:0 6px}
.pc button:disabled{opacity:.3;cursor:default}
.lw{margin:0 0 10px;padding:8px 10px;border:1px solid #ffffff22;border-radius:10px}
.lt{font:600 12px system-ui,sans-serif;opacity:.75;margin-bottom:7px}
.chs{display:flex;flex-wrap:wrap;gap:6px}
.ch{display:block;min-width:0;min-height:0;padding:7px 12px;border:1px solid #ffffff33;border-radius:9px;font:500 16px system-ui,"Segoe UI",sans-serif;text-align:left;white-space:pre-line}
.ch:hover{background:#ffffff2e}
#insn{z-index:40;gap:8px;padding:8px}
#insng{grid-template-columns:repeat(2,100px)}
</style>
</head>
<body>
<div id="board"><canvas id="bgc"></canvas><canvas id="imc"></canvas><canvas id="base"></canvas><canvas id="live"></canvas></div>
<div id="brand"><img class="lgo" alt="MA"><span>Mandal Academy</span></div>
<div id="dock" class="dock"></div>
<div id="rgt" class="dock"></div>
<div id="ecur" hidden></div>
<div id="pop" class="dock" hidden>
  <div class="row" id="shrow"></div>
  <div class="row" id="colrow"></div>
  <div class="row" id="szrow"><span>Size <b id="szv"></b></span><span class="mm" id="szmin"></span><input type="range" id="sz" min="2" max="24" value="4" aria-label="Size"><span class="mm" id="szmax"></span></div>
  <label class="row" id="adrow"><input type="checkbox" id="autod"> <span><b>Shape assist</b><br><small>(turns rough lines and circles into clean ones)</small></span></label>
</div>
<div id="smode" class="dock" hidden></div>
<div id="selbar" class="dock" hidden></div>
<div id="ntp" class="dock" hidden><div class="sg" id="ntg"></div></div>
<div id="dlp" class="dock" hidden></div>
<div id="insp" class="dock" hidden><div class="sg" id="insg"></div></div>
<div id="insn" class="dock" hidden><div class="sg" id="insng"></div></div>
<div id="toast" hidden></div>
<div id="lawp" class="dock" hidden><div class="row" id="lawtabs"></div><input type="search" id="lawq" placeholder="Search laws and formulas…"><div id="lawl"></div></div>
<div id="bgp" class="dock" hidden><div>Page color</div><div class="row" id="bgcols"></div><div class="row"><span>Any color</span><input type="color" id="bgcol" value="#ffffff" aria-label="Any color"></div><div>Page style</div><div class="row" id="bgst"></div><label class="row"><input type="checkbox" id="bgall"> Apply to all pages</label></div>
<div id="ov" hidden><div id="ovh"><img class="lgo lg" alt="MA"><b class="bn">Mandal Academy</b><h1>All Board</h1><span>New Board:</span><div id="ovadd" style="display:contents"></div></div><div id="ovg"></div></div>

  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(gest){
    if(ptrs.size<2)return;
    const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2;
    if(imgMode==='lock'){k=gest.k;tx=gest.tx;ty=gest.ty+(cy-gest.cy);later();return}
    k=Math.min(15*kfit(),Math.max(.25,gest.k*d/gest.d));
    tx=cx-(gest.cx-gest.tx)*k/gest.k;ty=cy-(gest.cy-gest.ty)*k/gest.k;
    later();return;
  }
  if(pan){tx=pan.tx+e.clientX-pan.x;ty=pan.ty+e.clientY-pan.y;later();return}
  if(sdrag){selMove(e);return}
  if(!cur||e.pointerId!==cur.id)return;
  const w=toW(e.clientX,e.clientY),pt=[w[0],w[1]-cur.oy],prev=cur.pts[cur.pts.length-1];
  if(cur.tool==='pen'&&!autoDraw&&cur.pts.length>1){cur.raw=pt.slice();pt[0]=prev[0]+(pt[0]-prev[0])*.55;pt[1]=prev[1]+(pt[1]-prev[1])*.55}
  cur.pts.push(pt);
  if(cur.tool==='eraser'){inPage(bc,cur.oy,()=>draw(bc,{...cur,pts:[prev,pt]},false))}
  else{clr(lc);inPage(lc,cur.oy,()=>draw(lc,cur,true))}
});
function end(){
  if(!cur)return;
  if(cur.tool==='pen'&&autoDraw){const r=recog(cur.pts);if(r)Object.assign(cur,r)}
  else if(cur.tool==='pen'&&cur.raw){cur.pts.push(cur.raw);delete cur.raw}
  if(cur.tool!=='eraser'){clr(lc);const tc=CT.includes(cur.tool)?ic:bc;inPage(tc,cur.oy,()=>draw(tc,cur,false))}
  curP.s.push(cur);curP.r=[];act=curP;cur=null;
}
function up(e){
  ptrs.delete(e.pointerId);
  pan=null;if(sdrag)sdrag=null;
  if(gest&&ptrs.size<2)gest=null;
  if(ptrs.size===0)wait=false;
  if(cur&&e.pointerId===cur.id)end();
}

function pd(q,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);return L?Math.abs(dy*(q[0]-a[0])-dx*(q[1]-a[1]))/L:Math.hypot(q[0]-a[0],q[1]-a[1])}
function rdp(p,e){
  if(p.length<3)return p;
  let mi=0,md=0;
  for(let i=1;i<p.length-1;i++){const d=pd(p[i],p[0],p[p.length-1]);if(d>md){md=d;mi=i}}
  if(md>e)return rdp(p.slice(0,mi+1),e).slice(0,-1).concat(rdp(p.slice(mi),e));
  return [p[0],p[p.length-1]];
}
function recog(p){
  if(p.length<6)return null;
  let L=0,x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  p.forEach((q,i)=>{if(i)L+=Math.hypot(q[0]-p[i-1][0],q[1]-p[i-1][1]);x1=Math.min(x1,q[0]);x2=Math.max(x2,q[0]);y1=Math.min(y1,q[1]);y2=Math.max(y2,q[1])});
  const w=x2-x1,h=y2-y1,m=Math.max(w,h),S=p[0],E=p[p.length-1],ch=Math.hypot(E[0]-S[0],E[1]-S[1]);
  if(m<40)return null;
  if(ch>.8*L&&Math.max(...p.map(q=>pd(q,S,E)))<.06*ch){
    let b=E;const n=Math.abs(Math.atan2(E[1]-S[1],E[0]-S[0])*180/Math.PI);
    if(n<6||n>174)b=[E[0],S[1]];else if(Math.abs(n-90)<6)b=[S[0],E[1]];
    return {tool:'line',pts:[S,b]};
  }
  if(ch>.3*L)return null;
  const cx=(x1+x2)/2,cy=(y1+y2)/2;
  const de=p.reduce((s,q)=>s+Math.abs(Math.hypot((q[0]-cx)/(w/2||1),(q[1]-cy)/(h/2||1))-1),0)/p.length;
  if(de<.12){let ww=w,hh=h;if(Math.abs(w-h)<.2*m)ww=hh=(w+h)/2;return {tool:'oval',pts:[[cx-ww/2,cy-hh/2],[cx+ww/2,cy+hh/2]]}}
  let fi=0,fd=0;p.forEach((q,i)=>{const d=Math.hypot(q[0]-S[0],q[1]-S[1]);if(d>fd){fd=d;fi=i}});
  let v=rdp(p.slice(0,fi+1),.07*m).slice(0,-1).concat(rdp(p.slice(fi),.07*m).slice(0,-1)),ok=true;
  while(ok&&v.length>3){ok=false;for(let i=0;i<v.length;i++){const a=v[(i+v.length-1)%v.length],b=v[i],c=v[(i+1)%v.length],u=[b[0]-a[0],b[1]-a[1]],t=[c[0]-b[0],c[1]-b[1]],cs=(u[0]*t[0]+u[1]*t[1])/(Math.hypot(u[0],u[1])*Math.hypot(t[0],t[1])||1);if(cs>.9){v.splice(i,1);ok=true;break}}}
  if(v.length===3)return {tool:'poly',pts:v,cl:1};
  if(v.length===4){const cn=[[x1,y1],[x2,y1],[x2,y2],[x1,y2]];if(v.every(q=>cn.some(z=>Math.hypot(q[0]-z[0],q[1]-z[1])<.2*m)))return {tool:'rect',pts:[[x1,y1],[x2,y2]]};return {tool:'poly',pts:v,cl:1}}
  return null;
}

function lawChips(b){
  const out=[];let tx=[];const fl=()=>{if(tx.length){out.push(tx.join('\n'));tx=[]}};
  b.split('\n').forEach(l=>{
    if(/[=\u221d\u21cc]/.test(l)&&!/^\d+\.\s/.test(l)){fl();l.split(/\s{3,}/).forEach(q=>{q=q.trim();if(q)out.push(q)})}
    else tx.push(l);
  });
  fl();return out;
}

function makePdf(jpgs){ // jpgs: [{data:Uint8Array,w,h}]
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const put=d=>{const u=typeof d==='string'?enc.encode(d):d;parts.push(u);len+=u.length};
  const obj=(n,fn)=>{offs[n]=len;put(n+' 0 obj\n');fn();put('\nendobj\n')};
  const N=jpgs.length,PWp=595,PHp=Math.round(595*PH/PW);
  put('%PDF-1.4\n%\xe2\xe3\xcf\xd3\n');

  obj(2,()=>put('<< /Type /Pages /Count '+N+' /Kids ['+jpgs.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>'));
  jpgs.forEach((j,i)=>{
    const pg=3+i*3,im=pg+1,ct=pg+2;
    obj(pg,()=>put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PWp+' '+PHp+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>'));
    obj(im,()=>{put('<< /Type /XObject /Subtype /Image /Width '+j.w+' /Height '+j.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.data.length+' >>\nstream\n');put(j.data);put('\nendstream')});
    const cs='q '+PWp+' 0 0 '+PHp+' 0 0 cm /Im0 Do Q';
    obj(ct,()=>put('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
  });

  for(let i=1;i<tot;i++)put(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  put('trailer\n<< /Size '+tot+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
