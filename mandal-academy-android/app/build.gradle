plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mandalacademy.whiteboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mandalacademy.whiteboard'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
